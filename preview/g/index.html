<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>hize — preview G</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: 대표작이 한 화면씩 꽉 차게 세로로 이어짐. 위에 메뉴·한 줄 문구·로고, 아래에 진행선·크레딧·타임코드가 영상 위에 얹힘. 단일 다크 톤 */
:root{--point:#ff3b1f;--ink:#0b0b0b;--paper:#f6f6f4;--mute:rgba(246,246,244,.7);--sans:"Pretendard","Apple SD Gothic Neo","Helvetica Neue",Arial,sans-serif;--mono:"Geist Mono",ui-monospace,Menlo,monospace;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-snap-type:y proximity}
body{background:var(--ink);color:var(--paper);font-family:var(--sans)}
.g{padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px))}
.hd{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;justify-content:space-between;align-items:flex-start;padding-block:calc(env(safe-area-inset-top,0px) + 24px) 0;pointer-events:none;color:#fff;text-shadow:0 1px 10px rgba(0,0,0,.25)}
.brand{display:grid;gap:10px;justify-items:start}
.hd .logo{width:clamp(96px,9vw,150px);height:auto;display:block}
.hd .tag{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.85}
.hd nav{display:flex;gap:clamp(18px,2.4vw,36px);font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;pointer-events:auto}
.hd nav a{color:inherit;text-decoration:none}
.sec{position:relative;height:100vh;height:100svh;overflow:hidden;scroll-snap-align:start;background:#000}
.sec img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;max-width:none;transform:scale(1.03)}
.sec.on img{animation:kb 9s linear forwards}
@keyframes kb{to{transform:scale(1.1)}}
.sec::after{content:"";position:absolute;inset:auto 0 0 0;height:35%;background:linear-gradient(transparent,rgba(0,0,0,.45));pointer-events:none}
.ov{position:absolute;left:0;right:0;bottom:0;z-index:2;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 26px)}
.bar1{position:relative;height:2px;background:rgba(255,255,255,.3);margin-top:18px;overflow:hidden}
.bar1 i{position:absolute;inset:0;background:#fff;transform-origin:left;transform:scaleX(0);transition:transform .1s linear}
.seg{position:relative;height:1px;background:rgba(255,255,255,.3)}
.seg.done{background:#fff}
.line{position:absolute;inset:0;overflow:hidden}
.line i{position:absolute;inset:0;background:#fff;transform-origin:left;transform:scaleX(0)}
.sec.on .seg.now .line i{animation:fill 9s linear forwards}
.seg.now .line i{background:var(--point)}
@keyframes fill{to{transform:scaleX(1)}}
.row{display:flex;justify-content:space-between;align-items:flex-end;gap:24px}
.lb{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;opacity:.8;margin-bottom:6px}
.cr{font-size:clamp(16px,1.35vw,20px);font-weight:500;letter-spacing:-.01em;line-height:1.3}
.ctl{display:flex;align-items:center;gap:18px;font-family:var(--mono);font-size:11px;letter-spacing:.08em;white-space:nowrap}
.ctl .rec{display:inline-flex;align-items:center;gap:7px}
.ctl .rec::before{content:"";width:7px;height:7px;background:var(--point);animation:bl 1.2s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.ctl .idx{opacity:.7}
.foot{padding-block:56px calc(env(safe-area-inset-bottom,0px) + 36px);display:flex;justify-content:space-between;flex-wrap:wrap;gap:16px;font-family:var(--mono);font-size:12px;letter-spacing:.1em;color:rgba(246,246,244,.55)}
.foot a{color:var(--paper);text-decoration:none;border-bottom:1px solid var(--point)}
@media(max-width:700px){.hd nav{gap:14px;font-size:11px}.row{flex-direction:column;align-items:flex-start;gap:10px}.ctl{gap:14px}.hd .logo{width:84px}}
@media (prefers-reduced-motion:reduce){.sec.on img,.sec.on .line i{animation:none}}
.vid{position:absolute;inset:0;overflow:hidden;opacity:0;transition:opacity .5s}
.vid.ready{opacity:1}
.vid iframe{position:absolute;left:50%;top:50%;width:max(100vw,177.78vh);height:max(100vh,56.25vw);transform:translate(-50%,-50%) scale(1.02);border:0;pointer-events:none}
.sec{cursor:pointer}
.pl{position:fixed;inset:0;z-index:20;background:#000;display:grid;place-items:center;padding:calc(env(safe-area-inset-top,0px) + 56px) 16px 32px}
.pl[hidden]{display:none}
.pl .box{width:min(100%,calc((100vh - 120px)*16/9));aspect-ratio:16/9}
.pl iframe{width:100%;height:100%;border:0}
.pl button{position:absolute;top:calc(env(safe-area-inset-top,0px) + 18px);right:24px;background:none;border:0;color:#fff;font-family:var(--mono);font-size:12px;letter-spacing:.1em;cursor:pointer}
html,body{margin:0}
</style></head><body>

<header class="hd g">

</header>

<script>
const F=[["w10","무너X소연 아무너케 MV","LG U+","_Ll5iGOyWZA"],["w11","달콤한 순간 #허쉬태그","HERSHEY’S","6funHKmcqyU"],["w08","아리수 마시지 마세요","서울아리수본부","mnU4ztmOj3k"],["w09","약하지 않아, 나약하지 않아","식품의약품안전처","ISSrcwWMz-o"],["w24","MOTION FLEX","SEALY","d_5eAmHebVY"],["w04","더하자, 유한젠","유한클로락스","RPUCzMxZFAs"]];
const list=document.getElementById("list");
F.forEach((f,i)=>{const s=document.createElement("section");s.className="sec";
 const im=new Image();im.src="/assets/img/work/"+f[0]+(["w10","w11","w08","w09"].includes(f[0])?"-l":"")+".webp";im.alt="";s.appendChild(im);const v=document.createElement("div");v.className="vid";s.appendChild(v);s.dataset.yt=f[3];s.onclick=()=>openPl(f[3]);
 const ov=document.createElement("div");ov.className="ov g";
 ov.innerHTML='<div class="row"><div><div class="lb"></div><div class="cr"></div></div><div class="ctl"><span class="idx">'+String(i+1).padStart(2,'0')+' / '+String(F.length).padStart(2,'0')+'</span><span class="rec tc">00:00:00:00</span></div></div><div class="bar1"><i></i></div>';
 ov.querySelector(".lb").textContent=f[2]+" · Dir. Park jinyong";
 ov.querySelector(".cr").textContent=f[1];
 s.appendChild(ov);list.appendChild(s)});
const secs=[...document.querySelectorAll(".sec")];let t0=Date.now(),cur=null,yt={t:0,d:0};
function stopV(x){const v=x.querySelector(".vid");v.classList.remove("ready");v.textContent=""}
function playV(x){const v=x.querySelector(".vid");if(v.firstChild)return;const id=x.dataset.yt;const f=document.createElement("iframe");
 f.src="https://www.youtube-nocookie.com/embed/"+id+"?autoplay=1&mute=1&controls=0&loop=1&playlist="+id+"&playsinline=1&modestbranding=1&rel=0&start=4&iv_load_policy=3&disablekb=1&enablejsapi=1&origin="+encodeURIComponent(location.origin);
 f.addEventListener("load",()=>{try{f.contentWindow.postMessage(JSON.stringify({event:"listening",id:id}),"*")}catch(e){}});
 f.allow="autoplay; encrypted-media";f.title="";f.setAttribute("tabindex","-1");v.appendChild(f);setTimeout(()=>v.classList.add("ready"),4000)}
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting&&e.intersectionRatio>.6){secs.forEach(x=>{if(x!==e.target){x.classList.remove("on");stopV(x)}});e.target.classList.add("on");yt={t:0,d:0};playV(e.target);cur=e.target;t0=Date.now()}}),{threshold:[.6]});
const pl=document.getElementById("pl"),plb=document.getElementById("plb");
function openPl(id){plb.innerHTML='<iframe allow="autoplay; encrypted-media; fullscreen" allowfullscreen src="https://www.youtube-nocookie.com/embed/'+id+'?autoplay=1&rel=0&playsinline=1"></iframe>';pl.hidden=false}
function closePl(){pl.hidden=true;plb.textContent=""}
document.getElementById("plx").onclick=closePl;addEventListener("keydown",e=>{if(e.key==="Escape")closePl()});
secs.forEach(s=>io.observe(s));
scrollTo(0,0);
addEventListener("message",e=>{if(!/youtube/.test(e.origin))return;let m;try{m=typeof e.data==="string"?JSON.parse(e.data):e.data}catch(_){return}
 if(m&&m.info){if(typeof m.info.currentTime==="number")yt.t=m.info.currentTime;if(typeof m.info.duration==="number"&&m.info.duration>0)yt.d=m.info.duration;if(m.info.playerState===1&&cur){setTimeout(()=>{const v=cur&&cur.querySelector(".vid");if(v)v.classList.add("ready")},250)}}});
function tc(sec){const s=Math.floor(sec),f=Math.floor((sec-s)*24);return "00:"+String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")+":"+String(f).padStart(2,"0")}
setInterval(()=>{if(!cur)return;const live=yt.d>0;const t=live?yt.t:(Date.now()-t0)/1000;
 cur.querySelector(".tc").textContent=tc(t);
 cur.querySelector(".bar1 i").style.transform="scaleX("+(live?Math.min(1,yt.t/yt.d):0)+")"},100);
</script>
