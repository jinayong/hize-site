<script>
const F=[{"img": "w10-l.webp", "title": "무너X소연 아무너케 MV", "yt": "_Ll5iGOyWZA", "client": "LG U+", "agency": "CJ ENM", "awards": []}, {"img": "w11-l.webp", "title": "달콤한 순간 #허쉬태그", "yt": "6funHKmcqyU", "client": "Hershey’s", "agency": "덴츠코리아", "awards": []}, {"img": "w08-l.webp", "title": "아리수 마시지 마세요", "yt": "mnU4ztmOj3k", "client": "서울아리수본부", "agency": "CJ ENM", "awards": ["2024 공공브랜드 대상 최우수상", "2024 올해의 광고 PR상 동상"]}, {"img": "w09-l.webp", "title": "약하지 않아, 나약하지 않아", "yt": "ISSrcwWMz-o", "client": "식품의약품안전처", "agency": "CJ ENM", "awards": ["2025 올해의 광고 PR상 금상"]}, {"img": "w24.webp", "title": "MOTION FLEX", "yt": "d_5eAmHebVY", "client": "Sealy", "agency": "함파트너스", "awards": []}, {"img": "w04.webp", "title": "더하자, 유한젠", "yt": "RPUCzMxZFAs", "client": "유한클로락스", "agency": "PT Korea", "awards": []}];
const AUTO={has:()=>true}; // 모든 작품: 화면에 자리잡으면 자동 재생, 다른 작품으로 넘어가면 앞 작품은 멈춤(소리도 꺼짐)
const list=document.getElementById("list");
const pad=n=>String(n).padStart(2,"0");
let vol=0; // 0 = 무음
F.forEach((f,i)=>{
 const s=document.createElement("section");s.className="sec";s.dataset.i=i;
 const im=new Image();im.src="/assets/img/work/"+f.img;im.alt=f.title;s.appendChild(im);
 const v=document.createElement("div");v.className="vid";s.appendChild(v);
 if(!AUTO.has(i)){const h=document.createElement("span");h.className="playhint";h.textContent="PLAY ▶";s.appendChild(h)}
 const hit=document.createElement("button");hit.className="hit";hit.setAttribute("aria-label",f.title+" 재생");hit.onclick=()=>play(s);s.appendChild(hit);
 const ov=document.createElement("div");ov.className="ov g";
 const row=document.createElement("div");row.className="row";
 const L=document.createElement("div");
 const cr=document.createElement("div");cr.className="cr";cr.textContent=f.title;L.appendChild(cr);
 const cd=document.createElement("div");cd.className="dir";cd.textContent="Dir. Park jinyong — "+f.client;L.appendChild(cd);
 const C=document.createElement("div");C.className="ctl";
 C.innerHTML='<span class="idx">'+pad(i+1)+' / '+pad(F.length)+'</span><span class="rec tc">00:00:00:00</span><button class="vol muted" type="button" aria-label="볼륨"><span class="lbl">VOL</span><span class="bars">'+[1,2,3,4,5,6].map(k=>'<span data-k="'+k+'" style="height:'+(2+k*1.7)+'px"></span>').join("")+'</span><span class="pct"></span></button>';
 row.append(L,C);ov.appendChild(row);
 const bar=document.createElement("div");bar.className="bar1";bar.innerHTML="<i></i>";ov.appendChild(bar);
 s.appendChild(ov);list.appendChild(s);
});
const secs=[...document.querySelectorAll(".sec")];
let cur=null,yt={t:0,d:0},t0=Date.now();
function frameOf(s){return s&&s.querySelector(".vid iframe")}
function cmd(s,func,args){const f=frameOf(s);if(!f)return;try{f.contentWindow.postMessage(JSON.stringify({event:"command",func:func,args:args||[]}),"*")}catch(e){}}
function applyVol(s){if(vol>0){cmd(s,"unMute");cmd(s,"setVolume",[Math.round(vol/6*100)])}else cmd(s,"mute")}
function paintVol(){document.querySelectorAll(".vol").forEach(b=>{b.classList.toggle("muted",vol===0);b.querySelectorAll(".bars span").forEach(x=>x.classList.toggle("on",+x.dataset.k<=vol))})}
function kAt(bars,x){const r=bars.getBoundingClientRect();return Math.max(0,Math.min(6,Math.round((x-r.left)/r.width*6)))}
function preview(bars,k){bars.querySelectorAll("span").forEach(x=>x.classList.toggle("pv",k!==null&&+x.dataset.k<=k&&+x.dataset.k>vol))}
function showPct(bars){const b=bars.closest(".vol");b.classList.add("adj");b.querySelector(".pct").textContent=Math.round(vol/6*100)+"%";clearTimeout(b._t);b._t=setTimeout(()=>b.classList.remove("adj"),900)}
document.addEventListener("pointerover",e=>{const bars=e.target.closest(".bars");if(bars&&!dragBars)preview(bars,kAt(bars,e.clientX))});
document.addEventListener("pointerout",e=>{const bars=e.target.closest(".bars");if(bars&&!bars.contains(e.relatedTarget))preview(bars,null)});
function setVolFrom(bars,x){const k=kAt(bars,x);showPct(bars);if(k!==vol){vol=k;paintVol();const s=bars.closest(".sec");if(s&&!frameOf(s))play(s);applyVol(s)}}
let dragBars=null;
document.addEventListener("pointerdown",e=>{const bars=e.target.closest(".bars");if(!bars)return;e.preventDefault();e.stopPropagation();dragBars=bars;try{bars.setPointerCapture(e.pointerId)}catch(_){};setVolFrom(bars,e.clientX)},true);
document.addEventListener("pointermove",e=>{if(dragBars){setVolFrom(dragBars,e.clientX);preview(dragBars,null);return}const bars=e.target.closest&&e.target.closest(".bars");if(bars)preview(bars,kAt(bars,e.clientX))});
document.addEventListener("pointerup",()=>{dragBars=null});document.addEventListener("pointercancel",()=>{dragBars=null});
document.addEventListener("click",e=>{const btn=e.target.closest(".vol");if(!btn)return;e.stopPropagation();if(e.target.closest(".bars"))return;
 vol=vol?0:4;paintVol();const s=btn.closest(".sec");if(s&&!frameOf(s))play(s);applyVol(s)},true);
function stop(s){s.classList.remove("playing");const v=s.querySelector(".vid");v.classList.remove("ready");v.textContent="";s.querySelector(".bar1 i").style.transform="scaleX(0)";s.querySelector(".tc").textContent="00:00:00:00"}
function play(s){if(frameOf(s))return;const f=F[+s.dataset.i];secs.forEach(x=>{if(x!==s&&frameOf(x))stop(x)});
 const v=s.querySelector(".vid");const fr=document.createElement("iframe");
 fr.src="https://www.youtube-nocookie.com/embed/"+f.yt+"?autoplay=1&mute=1&controls=0&loop=1&playlist="+f.yt+"&playsinline=1&modestbranding=1&rel=0&iv_load_policy=3&cc_load_policy=0&cc_lang_pref=none&disablekb=1&enablejsapi=1&origin="+encodeURIComponent(location.origin);
 fr.allow="autoplay; encrypted-media";fr.title="";fr.setAttribute("tabindex","-1");
 fr.addEventListener("load",()=>{try{fr.contentWindow.postMessage(JSON.stringify({event:"listening",id:f.yt}),"*")}catch(e){}});
 v.appendChild(fr);s.classList.add("playing");cur=s;yt={t:0,d:0};t0=Date.now();setTimeout(()=>v.classList.add("ready"),4000)}
addEventListener("message",e=>{if(!/youtube/.test(e.origin))return;let m;try{m=typeof e.data==="string"?JSON.parse(e.data):e.data}catch(_){return}
 if(!m||!m.info)return;if(typeof m.info.currentTime==="number")yt.t=m.info.currentTime;if(m.info.duration>0)yt.d=m.info.duration;
 if(m.info.playerState===1&&cur){const v=cur.querySelector(".vid");if(!v.classList.contains("ready")){setTimeout(()=>v.classList.add("ready"),300);applyVol(cur)}cmd(cur,"unloadModule",["captions"]);cmd(cur,"unloadModule",["cc"]);}});
const io=new IntersectionObserver(es=>es.forEach(e=>{const s=e.target,i=+s.dataset.i;
 if(e.isIntersecting&&e.intersectionRatio>.6){if(AUTO.has(i))play(s)}
 else if(!e.isIntersecting||e.intersectionRatio<.25){if(frameOf(s))stop(s);if(cur===s)cur=null}}),{threshold:[0,.25,.6]});
secs.forEach(s=>io.observe(s));
function tc(x){const s=Math.floor(x),f=Math.floor((x-s)*24);return "00:"+pad(Math.floor(s/60))+":"+pad(s%60)+":"+pad(f)}
setInterval(()=>{if(!cur)return;const live=yt.d>0;cur.querySelector(".tc").textContent=tc(live?yt.t:0);cur.querySelector(".bar1 i").style.transform="scaleX("+(live?Math.min(1,yt.t/yt.d):0)+")"},100);
const curEl=document.getElementById("cur");
document.addEventListener("pointermove",e=>{if(e.pointerType!=="mouse"){curEl.classList.remove("show");return}const s=e.target.closest&&e.target.closest(".sec");
 const on=s&&!AUTO.has(+s.dataset.i)&&!s.classList.contains("playing")&&!e.target.closest(".ctl");curEl.classList.toggle("show",!!on);if(on){curEl.style.left=e.clientX+"px";curEl.style.top=e.clientY+"px"}});
document.addEventListener("pointerleave",()=>curEl.classList.remove("show"));
document.addEventListener("click",e=>{if(e.target.closest(".hit"))curEl.classList.remove("show")});
(function(){const cover=document.getElementById("cover");if(!cover)return;let closed=false;
 if(location.hash==="#home"){cover.hidden=true;return}
 addEventListener("hashchange",()=>{if(location.hash==="#home")close()});
 document.documentElement.classList.add("cv-lock");
 const t=performance.now(),el=document.getElementById("cvtc");(function tick(){if(closed)return;const f=Math.floor((performance.now()-t)/(1000/24));el.textContent="00:"+pad(Math.floor(f/1440)%60)+":"+pad(Math.floor(f/24)%60)+":"+pad(f%24);requestAnimationFrame(tick)})();
 const close=()=>{if(closed)return;closed=true;cover.classList.add("out");document.documentElement.classList.remove("cv-lock");setTimeout(()=>{cover.hidden=true},700)};
 cover.addEventListener("click",close);
 cover.addEventListener("wheel",e=>{if(e.deltaY>10)close()},{passive:true});
 let ty=null;cover.addEventListener("touchstart",e=>{ty=e.touches[0].clientY},{passive:true});
 cover.addEventListener("touchmove",e=>{if(ty!==null&&ty-e.touches[0].clientY>40){ty=null;close()}},{passive:true});
 document.addEventListener("keydown",e=>{if(!closed&&(e.key==="Enter"||e.key===" "||e.key==="ArrowDown")){e.preventDefault();close()}});
 try{cover.focus({preventScroll:true})}catch(_){}
})();
paintVol();scrollTo(0,0);
</script></body></html>
